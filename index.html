<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6LCQNCFV2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-V6LCQNCFV2');
    </script>
</head>

<body>

    <div class="overlay"></div>

    <main class="hero">

        <div class="glass-box">

            <p class="small-text">WELCOME TO MY WEBSITE</p>

            <h1>Enter Your World</h1>

            <p class="description">
                A simple, clean and modern website.
            </p>

            <div class="auth-box">

                <h2>Account</h2>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >

                <button onclick="createAccount()">
                    Create Account
                </button>

                <button onclick="login()">
                    Login
                </button>

                <button onclick="logout()">
                    Logout
                </button>

                <p id="authMessage"></p>

                <p id="userStatus">
                    Not logged in
                </p>

            </div>

        </div>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
