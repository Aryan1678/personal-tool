<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Tool</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-V6LCQNCFV2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-V6LCQNCFV2');
    </script>
</head>

<body>

    <div class="overlay"></div>

    <main class="hero">

        <div class="glass-box">

            <div class="brand">
                <span>⚔</span>
                <h1>SAMURAI</h1>
            </div>

            <p class="tagline">ENTER YOUR WORLD</p>

            <div class="auth-box">

                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Login or create your account</p>

                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button class="primary-btn" onclick="login()">
                    Login
                </button>

                <button class="secondary-btn" onclick="createAccount()">
                    Create Account
                </button>

                <button class="logout-btn" onclick="logout()">
                    Logout
                </button>

                <p id="authMessage"></p>

                <div class="user-status">
                    <span class="status-dot"></span>
                    <span id="userStatus">Not logged in</span>
                </div>

            </div>

        </div>

    </main>

    <script type="module" src="script.js"></script>

</body>
</html>
